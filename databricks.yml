bundle:
  name: cto_lakehouse

variables:
  catalog:
    default: workspace
  prefix:
    default: cto
  source:
    default: samples.tpch

resources:
  jobs:
    cto_lakehouse_pipeline:
      name: cto_lakehouse_pipeline
      # email_notifications:
      #   on_failure: [you@example.com]
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: prefix
          default: ${var.prefix}
        - name: source
          default: ${var.source}
        - name: simulate_defects
          default: "false"
        - name: fail_on_alert
          default: "true"
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.py
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ./notebooks/02_silver.py
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ./notebooks/03_gold.py
        - task_key: validation
          depends_on: [{task_key: gold}]
          notebook_task:
            notebook_path: ./notebooks/04_validation.py
        - task_key: monitoring
          depends_on: [{task_key: validation}]
          notebook_task:
            notebook_path: ./notebooks/06_monitoring.py

targets:
  dev:
    mode: development
    default: true
